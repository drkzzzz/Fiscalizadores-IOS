name: fiscalizadores_satt
description: "Fiscalizadores SAT - Gestión de fiscalización tributaria"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0
  flutter_launcher_icons: ^0.14.0
  image_picker: ^1.2.3
  image: ^4.2.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  intl: 0.20.3
  latlong2: ^0.10.1
  font_awesome_flutter: ^11.0.0
  sqflite: ^2.4.4
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  path_provider: ^2.1.6
  path: ^1.9.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  # Icono base: logo del SAT sobre el azul de la app, sin canal alfa.
  # iOS rechaza iconos transparentes, por eso se usa esta version aplanada
  # en lugar de assets/logo_sat_icon.png (que es RGBA y va como primer plano
  # del icono adaptativo de Android).
  image_path: "assets/logo_sat_ios.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/logo_sat_ios.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo_sat.png
    - assets/logo_sat_icon.png
